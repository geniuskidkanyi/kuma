name: release

# Builds Kuma installers for macOS, Windows and Linux and attaches them to a
# GitHub Release. Triggered by pushing a version tag (e.g. `v0.1.0`), or run
# manually from the Actions tab (which produces a draft release).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Don't let one platform's failure cancel the others — a working macOS
      # build should still ship even if a GPU-SDK step needs tweaking.
      fail-fast: false
      matrix:
        include:
          # macOS — Metal is the default backend on macOS, no feature flag.
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
            features: ""
            label: macOS (Apple Silicon · Metal)
          - platform: macos-13 # Intel
            target: x86_64-apple-darwin
            features: ""
            label: macOS (Intel · Metal)
          # Windows — Vulkan covers NVIDIA, AMD and Intel GPUs/iGPUs.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            features: "--features vulkan"
            label: Windows (Vulkan)
          # Linux — Vulkan, same broad GPU coverage.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: "--features vulkan"
            label: Linux (Vulkan)

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install cmake (builds whisper.cpp)
        uses: lukka/get-cmake@latest

      # --- Linux: Tauri system libraries + audio (ALSA for cpal) ---
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf file

      # --- Linux: Vulkan SDK via LunarG's apt repository (provides glslc) ---
      - name: Install Vulkan SDK (Linux)
        if: matrix.platform == 'ubuntu-22.04' && contains(matrix.features, 'vulkan')
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      # --- Windows: Vulkan SDK (provides glslc + loader + headers) ---
      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest' && contains(matrix.features, 'vulkan')
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.290.0
          install_runtime: true
          cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app + create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing is intentionally left unset for now — builds are
          # unsigned (users bypass Gatekeeper / SmartScreen). See the signing
          # notes in .github/workflows/README.md to enable it.
        with:
          args: ${{ matrix.features }} --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "Kuma ${{ github.ref_name }}"
          releaseBody: "Kuma — offline speech-to-text. Download the installer for your platform below."
          releaseDraft: true
          prerelease: false
